<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Twidder</title>
    <link href="static/client.css" type="text/css" rel="stylesheet" />
    <script src="static/client.js" type="text/javascript"></script>

    <script type="text/view" id="postOnOtherWall">
      <p><b>Post a new message</b></p>
      <form class="postMessage-form" onsubmit="otherUserPostMessage(this);return false;">
        <textarea name="otherMessage" id="otherMessage" rows="5" cols="30"> </textarea>
        <button class="profile-button" type="submit" value="Submit">Post Message</button>
      </form>
    </script>
    
    <script type="text/view" id="searchedWallCode">
      <p><b>The Wall</b></p>
        <div>
        <ul class="messageWall" id="searchedMessageWall">
        </ul>
        <button class="profile-button" onclick="refreshSearchedWall(searchedMessageWall)">Refresh Wall</button>
      </div>
    </script>

    <script type="text/view" id="profileview">
      <div class="tab">
        <button class="tablinks" onclick="changeTab(event, 'Home');"    id="defualtTab"> Home </button>
        <button class="tablinks" onclick="changeTab(event, 'Browse');"  > Browse </button>
        <button class="tablinks" onclick="changeTab(event, 'Account');" > Account </button>
      </div>



      <div id="Home" class="tabcontent">
      <div class="home-Wrapper">


        <div>
          <p><b>The Wall</b></p>
        <ul class="messageWall" id="userMessageWall">
        </ul>
        <button class="profile-button" type="button" onclick="refreshWall(userMessageWall)">Refresh Wall</button>
      </div>


        <div id="userInfo" class="userInfo">
          <p><b>Personal Info</b></p>
          <p><b>Email:</b>    <span id="userInfoEmail"></span></p>
          <p><b>Name:</b>     <span id="userInfoName"></span></p>
          <p><b>Family Name:</b>  <span id="userInfoFamilyName"></span></p>
          <p><b>Gender:</b>   <span id="userInfoGender"></span></p>
          <p><b>City:</b>     <span id="userInfoCity"></span></p>
          <p><b>Country:</b>  <span id="userInfoCountry"></span></p>
        </div>
      </div>

      <div id="userPostMessage">
        <p><b>Post a new message</b></p>
        <form class="postMessage-form" onsubmit="postMessage(this);return false;">
          <textarea name="message" id="message" rows="5" cols="42"> </textarea>
          <button class="profile-button" type="submit" value="Submit">Post Message</button>
        </form>
      </div>
      <div id="homeMessageFeedback"></div>


      </div>


      <div id="Browse" class="tabcontent">
        <div id="search-form">
        <form onsubmit="searchProfile(this);return false;">
          <div class="log-form">
            <label>Search user:</label>
            <input type="text" id="profileLookUp">
            <button type="submit" value="Submit">search</button>
          </div>
        </form>
        <div id="searchedUserFeedback"></div>
      </div>
        <div class="home-Wrapper">

        <div id="searchedUserWall">
        </div>

        <div style="display:none;" id="searchedUserInfo" class="userInfo">
          <p><b>Personal Info</b></p>
          <p><b>Email:</b>    <span id="userInfoEmail"></span></p>
          <p><b>Name:</b>     <span id="userInfoName"></span></p>
          <p><b>Family Name:</b>  <span id="userInfoFamilyName"></span></p>
          <p><b>Gender:</b>   <span id="userInfoGender"></span></p>
          <p><b>City:</b>     <span id="userInfoCity"></span></p>
          <p><b>Country:</b>  <span id="userInfoCountry"></span></p>
        </div>
      </div>

        <div id ="searchedUserPost">
        </div>
        <div id="searchedUserMessageFeedback"></div>

      </div>


      <div id="Account" class="tabcontent">
        <p>Change password</p>
        <form onsubmit="changePassword(this);return false">
          <div class ="profile-wrapper">
          <div class="log-form">
            <label>current password</label>
            <input type="password" id="oldPassword" required/>
          </div>

          <div class="log-form">
            <label>new password</label>
            <input type="password" id="newPassword" required/>
          </div>

          <div class="log-form">
            <label>confirm new PSW</label>
            <input type="password" id="confirmedNewPassword" required/>
          </div>

          <button class="profile-button" type="submit" value="Submit">Change password</button>
        </form>
        <button class="profile-button" onclick="signout()">Sign out</button>
        <div id="feedback"> </div>
      </div>
      </div>
    </script>

    <script type="text/view" id="welcomeview">
         <div class="outer-container">

        <div class="left-container">
          <img src="static/wimage.png" alt="logo" />
        </div>


        <div class="top-down-container">
          <div class="login-container">
            <form onsubmit="signin(this);return false;">
              <div class="log-form">
                <label>Email</label>
                <input type="email" id="logemail" required />
              </div>

              <div class="log-form">
                <label>Password</label>
                <input type="password" id="logPassword" required/>
              </div>

              <div class="button-container">
                <button type="submit" value="Submit">sign in</button>
              </div>
            </form>
          </div>

          <div class="signup-container">
            <h3 class="title">Sign up here</h3>
            <form onsubmit="signup(this);return false;">
              <div class="log-form">
                <label> First Name </label>
                <input type="text" id="firstName" required/>
              </div>

              <div class="log-form">
                <label>Family Name</label>
                <input type="text" id="familyName" required/>
              </div>

              <div class="log-form">
                <label>Gender</label>
                <select id="gender">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>

              <div class="log-form">
                <label>City</label>
                <input type="text" id="city" required/>
              </div>

              <div class="log-form">
                <label>Country</label>
                <input type="text" id="country" required/>
              </div>

              <div class="log-form">
                <label>Email</label>
                <input type="email" id="email" required />
              </div>

              <div class="log-form">
                <label>Password</label>
                <input type="password" id="password" minlength="5" required/>
              </div>

              <div class="log-form">
                <label>Repeat PSW</label>
                <input type="password" id="repPassword" required>
              </div>

              <div class="button-container">
                <button type="submit" value="Submit">sign up</button>
              </div>
              <div id="feedback"></div>
            </form>
          </div>
        </div>
      </div>
    </script>
  </head>

  <body>
    <div id="currview"></div>
  </body>
</html>
